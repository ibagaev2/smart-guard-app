<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0e27">
    <title>Smart-Guard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-effects">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
    </div>

    <div class="app-container">

        <header class="header">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L4 6V11C4 16.55 7.16 21.74 12 23C16.84 21.74 20 16.55 20 11V6L12 2Z"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M9 12L11 14L15 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </div>
                <div class="logo-text">
                    <h1>Smart-Guard</h1>
                    <p>Anti-Theft Protection</p>
                </div>
            </div>
            <div class="status-dot" id="statusDot"></div>
        </header>

        <main class="main-card">

            <div class="status-badge" id="statusBadge">
                <div class="status-indicator"></div>
                <span id="statusText">Getrennt</span>
            </div>

            <div class="device-visual">
                <div class="signal-rings" id="signalRings">
                    <div class="ring ring-1"></div>
                    <div class="ring ring-2"></div>
                    <div class="ring ring-3"></div>
                </div>
                <div class="device-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6.5 8.5L17.5 15.5L12 19V5L17.5 8.5L6.5 15.5" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>
            </div>

            <div class="info-section">
                <h2 id="mainTitle">Bereit zum Verbinden</h2>
                <p id="mainDescription">Verbinde dich mit deinem Smart-Guard Gerät um den Diebstahlschutz zu aktivieren.
                </p>
            </div>

            <!-- Verbinden Button -->
            <button id="connectBtn" class="primary-button">
                <span class="button-content">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7 7L17 17L12 22V2L17 7L7 17" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    Gerät verbinden
                </span>
            </button>

            <!-- ARM Button — nur sichtbar wenn verbunden -->
            <button id="armBtn" class="arm-button" style="display:none">
                <span class="button-content">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L4 6V11C4 16.55 7.16 21.74 12 23C16.84 21.74 20 16.55 20 11V6L12 2Z"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    Schutz aktivieren
                </span>
            </button>

            <!-- Verbindung planen Button -->
            <button id="showScheduleBtn" class="secondary-button">
                <span class="button-content">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
                        <path d="M12 6v6l4 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    Verbindung planen
                </span>
            </button>

            <!-- Zeitplan -->
            <div class="schedule-section" id="scheduleSection">
                <div class="schedule-title">Geplante Verbindung</div>
                <div class="schedule-row">
                    <div class="schedule-field">
                        <label>Aktiv ab</label>
                        <input type="time" id="startTime" value="14:30">
                    </div>
                    <div class="schedule-field">
                        <label>Aktiv bis</label>
                        <input type="time" id="endTime" value="19:30">
                    </div>
                </div>
                <button id="scheduleBtn" class="schedule-button">Planen</button>
                <button id="cancelScheduleBtn" class="cancel-button">Abbrechen</button>
                <div id="scheduleStatus" class="schedule-info"></div>
            </div>

            <!-- Stats Grid mit 4 Karten -->
            <div class="stats-grid stats-grid-4">
                <div class="stat-card">
                    <div class="stat-label">Verbindung</div>
                    <div class="stat-value" id="connectionStat">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Signal</div>
                    <div class="stat-value" id="signalStat">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Status</div>
                    <div class="stat-value" id="statusStat">Inaktiv</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Akku</div>
                    <div class="stat-value" id="batteryStat">—</div>
                </div>
            </div>

        </main>

        <footer class="footer">
            <p>Smart-Guard v1.0 · Sommerprojekt 2026</p>
        </footer>

    </div>

    <script src="app.js"></script>
</body>

</html>
